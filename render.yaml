# Render Blueprint — Método Ponto B (frontend + API no mesmo serviço)
# Banco de dados: PostgreSQL gerenciado externamente (Neon) via DATABASE_URL.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pontob
    runtime: node
    plan: free
    region: oregon
    branch: deploy/render
    buildCommand: corepack enable && pnpm install --frozen-lockfile && BASE_PATH=/ pnpm --filter @workspace/pontob build && pnpm --filter @workspace/api-server build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      # base do frontend (app servido na raiz do domínio)
      - key: BASE_PATH
        value: /
      # porta que o servidor escuta (Render detecta automaticamente)
      - key: PORT
        value: "10000"
      # segredo das sessões de login — gerado automaticamente pelo Render
      - key: SESSION_SECRET
        generateValue: true
      # connection string do Neon (cole no painel do Render)
      - key: DATABASE_URL
        sync: false
      # host público da app, usado em e-mails/convites (ex: pontob.onrender.com)
      - key: REPLIT_DOMAINS
        sync: false
      # --- Opcionais (deixe em branco se não for usar) ---
      # envio de e-mail (lembretes/convites) via Gmail:
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # recursos de IA (assistente/coaching) — precisa de chave OpenAI:
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
