kind = "mobile"
previewPath = "/mobile/"
title = "Ponto B Mobile"
version = "1.0.0"
id = "artifacts/pontob-mobile"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/"
name = "expo"
paths = [ "/mobile/" ]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/pontob-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pontob-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pontob-mobile", "run", "serve" ]

[services.env]
PORT = "3000"
BASE_PATH = "/mobile/"
