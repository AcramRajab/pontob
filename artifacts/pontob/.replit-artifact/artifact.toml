kind = "web"
previewPath = "/"
title = "Método Ponto B"
version = "1.0.0"
id = "artifacts/pontob"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21310

[services.development]
run = "pnpm --filter @workspace/pontob run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pontob", "run", "build" ]
publicDir = "artifacts/pontob/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21310"
BASE_PATH = "/"
