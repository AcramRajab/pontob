          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /vagas/{id}/candidatos:
    post:
      operationId: createCandidato
      tags: [candidatos]
      summary: Add a candidate to a vaga
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidatoInput"
      responses:
        "201":
          description: Created candidato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidato"

  /candidatos/{id}:
    patch:
      operationId: updateCandidato
      tags: [candidatos]
      summary: Update a candidate (stage, notes, recommendation)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidatoUpdate"
      responses:
        "200":
          description: Updated candidato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidato"
    delete:
      operationId: deleteCandidato
      tags: [candidatos]
      summary: Delete a candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

