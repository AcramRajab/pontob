openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Método Ponto B - RE/MAX SC API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: franchises
  - name: users
  - name: dimensions
  - name: keyProcesses
  - name: strategicInitiatives
  - name: goals
  - name: kpis
  - name: goalInitiatives
  - name: dailyCheckins
  - name: weeklyCheckins
  - name: monthlyCheckins
  - name: alerts
  - name: helpRequests
  - name: dashboard
  - name: exports
  - name: franchiseKris
  - name: vagas
  - name: candidatos
  - name: recruitingAI
  - name: planner
    description: AI-powered recruiting assistant for candidate planning and search
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /franchises:
    get:
      operationId: listFranchises
      tags: [franchises]
      summary: List all franchises
      responses:
        "200":
          description: List of franchises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Franchise"
    post:
      operationId: createFranchise
      tags: [franchises]
      summary: Create a franchise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Franchise"

  /franchises/{id}:
    get:
      operationId: getFranchise
      tags: [franchises]
      summary: Get a franchise by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Franchise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Franchise"
    patch:
      operationId: updateFranchise
      tags: [franchises]
      summary: Update a franchise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Franchise"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (master_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete own account
        "404":
          description: Not found

  /dimensions:
    get:
      operationId: listDimensions
      tags: [dimensions]
      summary: List all dimensions
      responses:
        "200":
          description: List of dimensions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dimension"

  /key-processes:
    get:
      operationId: listKeyProcesses
      tags: [keyProcesses]
      summary: List key processes
      parameters:
        - name: dimensionId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of key processes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeyProcess"

  /strategic-initiatives:
    get:
      operationId: listStrategicInitiatives
      tags: [strategicInitiatives]
      summary: List strategic initiatives
      parameters:
        - name: dimensionId
          in: query
          schema:
            type: integer
        - name: keyProcessId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of strategic initiatives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategicInitiative"

  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List goals
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
        - name: dimensionId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get a goal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalDetail"
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}/kpis:
    get:
      operationId: listGoalKpis
      tags: [kpis]
      summary: List KPIs for a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of KPIs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kpi"
    post:
      operationId: createKpi
      tags: [kpis]
      summary: Create a KPI for a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kpi"

  /kpis/{id}:
    patch:
      operationId: updateKpi
      tags: [kpis]
      summary: Update a KPI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kpi"
    delete:
      operationId: deleteKpi
      tags: [kpis]
      summary: Delete a KPI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /goals/{id}/initiatives:
    get:
      operationId: listGoalInitiatives
      tags: [goalInitiatives]
      summary: List initiatives for a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of goal initiatives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalInitiative"
    post:
      operationId: createGoalInitiative
      tags: [goalInitiatives]
      summary: Add an initiative to a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInitiativeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalInitiative"

  /goal-initiatives:
    get:
      operationId: listAllGoalInitiatives
      tags: [goalInitiatives]
      summary: List all goal initiatives for a franchise
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of goal initiatives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalInitiative"

  /goal-initiatives/{id}:
    get:
      operationId: getGoalInitiative
      tags: [goalInitiatives]
      summary: Get a goal initiative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalInitiative"
    patch:
      operationId: updateGoalInitiative
      tags: [goalInitiatives]
      summary: Update a goal initiative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInitiativeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalInitiative"

  /daily-checkins:
    get:
      operationId: listDailyCheckins
      tags: [dailyCheckins]
      summary: List daily check-ins
      parameters:
        - name: goalId
          in: query
          schema:
            type: integer
        - name: franchiseId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of daily check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyCheckin"
    post:
      operationId: createDailyCheckin
      tags: [dailyCheckins]
      summary: Create a daily check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyCheckinInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyCheckin"

  /weekly-checkins:
    get:
      operationId: listWeeklyCheckins
      tags: [weeklyCheckins]
      summary: List weekly check-ins
      parameters:
        - name: goalId
          in: query
          schema:
            type: integer
        - name: franchiseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of weekly check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyCheckin"
    post:
      operationId: createWeeklyCheckin
      tags: [weeklyCheckins]
      summary: Create a weekly check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyCheckinInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyCheckin"

  /monthly-checkins:
    get:
      operationId: listMonthlyCheckins
      tags: [monthlyCheckins]
      summary: List monthly check-ins
      parameters:
        - name: goalId
          in: query
          schema:
            type: integer
        - name: franchiseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of monthly check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyCheckin"
    post:
      operationId: createMonthlyCheckin
      tags: [monthlyCheckins]
      summary: Create a monthly check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyCheckinInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyCheckin"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/{id}/resolve:
    patch:
      operationId: resolveAlert
      tags: [alerts]
      summary: Resolve an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /help-requests:
    get:
      operationId: listHelpRequests
      tags: [helpRequests]
      summary: List help requests
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of help requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"
    post:
      operationId: createHelpRequest
      tags: [helpRequests]
      summary: Create a help request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /help-requests/{id}:
    patch:
      operationId: updateHelpRequest
      tags: [helpRequests]
      summary: Update a help request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /dashboard/franchise:
    get:
      operationId: getFranchiseDashboard
      tags: [dashboard]
      summary: Get franchise dashboard summary
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Franchise dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseDashboard"

  /dashboard/goal-progress:
    get:
      operationId: getGoalProgress
      tags: [dashboard]
      summary: Get goal progress for a franchise filtered by period
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Goal progress data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalProgressItem"

  /dashboard/regional-vision:
    get:
      operationId: getRegionalVision
      tags: [dashboard]
      summary: Get aggregated vision (targets + actuals) across all franchises for the region
      parameters:
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Regional vision data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionalVision"

  /dashboard/regional:
    get:
      operationId: getRegionalDashboard
      tags: [dashboard]
      summary: Get regional dashboard summary (admin/staff)
      responses:
        "200":
          description: Regional dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionalDashboard"

  /dashboard/ranking:
    get:
      operationId: getFranchiseRanking
      tags: [dashboard]
      summary: Get franchise ranking
      parameters:
        - name: by
          in: query
          schema:
            type: string
            enum: [score, execution, consistency, kri]
      responses:
        "200":
          description: Franchise ranking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FranchiseRankingItem"

  /dashboard/today:
    get:
      operationId: getTodayOverview
      tags: [dashboard]
      summary: Get today overview for franchisee
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Today overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayOverview"

  /progress-history:
    get:
      operationId: listProgressHistory
      tags: [dashboard]
      summary: List progress history
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Progress history list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressHistoryItem"

  /franchise-kris:
    get:
      operationId: listFranchiseKris
      tags: [franchiseKris]
      summary: List franchise KRIs (CRECI, CREs, VGH) by period
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of franchise KRI records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FranchiseKri"
    post:
      operationId: upsertFranchiseKri
      tags: [franchiseKris]
      summary: Create or update franchise KRIs for a given month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseKriInput"
      responses:
        "200":
          description: KRI record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseKri"
        "201":
          description: KRI record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseKri"

  /exports/goals:
    get:
      operationId: exportGoalsCsv
      tags: [exports]
      summary: Export goals as CSV
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /exports/checkins:
    get:
      operationId: exportCheckinsCsv
      tags: [exports]
      summary: Export all check-ins as CSV
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly]
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /vagas:
    get:
      operationId: listVagas
      tags: [vagas]
      summary: List job openings
      parameters:
        - name: franchiseId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of vagas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vaga"
    post:
      operationId: createVaga
      tags: [vagas]
      summary: Create a new job opening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VagaInput"
      responses:
        "201":
          description: Created vaga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vaga"

  /vagas/{id}:
    get:
      operationId: getVaga
      tags: [vagas]
      summary: Get a job opening with its candidates
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vaga detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VagaDetail"
        "404":
          description: Not found
    patch:
      operationId: updateVaga
      tags: [vagas]
      summary: Update a job opening
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VagaUpdate"
      responses:
        "200":
          description: Updated vaga
          content:
